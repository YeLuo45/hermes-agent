name: web-scrapling
version: 0.1.0
description: >-
  Scrapling: adaptive self-hosted web extraction. Open-source alternative
  to Firecrawl. Anti-bot bypass (Cloudflare Turnstile), stealth headless
  browsing, and an adaptive parser that survives website redesigns.
  Extract-only — pair with a search provider (ddgs/brave/searxng) for
  search queries.
author: "Hermes Agent integration by 小墨 (boss-requested)"
homepage: https://github.com/D4Vinci/Scrapling
license: BSD-3-Clause
kind: backend
provides_web_providers:
  - scrapling
requires:
  python: ">=3.10"
  packages:
    - "scrapling>=0.4.8"
  optional_packages:
    - name: "scrapling[all]"
      description: "Enables StealthyFetcher + DynamicFetcher (Playwright + browser deps)"
    - name: "scrapling[stealth]"
      description: "Enables StealthyFetcher (Cloudflare bypass) without full browser deps"
config_keys:
  - web.extract_backend
  - web.backend
  - web.scrapling.stealthy_fallback
  - web.scrapling.adaptive
  - web.scrapling.timeout
  - web.scrapling.headless
  - web.scrapling.proxy
  - web.scrapling.user_data_dir
  - web.scrapling.max_content_chars
  - web.scrapling.selector_strategy
